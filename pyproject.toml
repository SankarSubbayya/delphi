[project]
name = "delphi"
version = "0.1.0"
description = "Synthetic populations as a computational substrate — Gemini 3.5 Flash swarm-reasoning primitive"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
